<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resolução de Desafios JS - Arrays, DOM e Eventos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .destaque {
      font-weight: bold;
      color: #0066cc;
    }
    .feito {
      text-decoration: line-through;
      color: gray;
    }
    form {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Elementos do Bloco 2 e Bloco 3 -->
  <h1 id="titulo">Título Inicial</h1>
  
  <p class="texto">Primeiro parágrafo de exemplo.</p>
  <p class="texto">Segundo parágrafo de exemplo.</p>

  <button id="botao">Clique aqui</button>

  <br><br>
  <input type="text" id="nome" placeholder="Digite seu nome">

  <h2>Lista de Tarefas:</h2>
  <ul id="lista">
    <!-- Itens para testar Event Delegation -->
    <li>Item Inicial 1</li>
    <li>Item Inicial 2</li>
    <li>Item Inicial 3</li>
  </ul>

  <form id="formulario">
    <input type="text" id="tarefa" placeholder="Nova tarefa">
    <button type="submit">Adicionar Tarefa</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
